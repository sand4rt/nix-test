name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NIX_CONFIG: |-
    experimental-features = nix-command flakes
    show-trace = true

jobs:
  evaluate:
    name: Evaluate flake
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      matrix: ${{ steps.matrix.outputs.value }}
    steps:
      - uses: actions/checkout@v5
      - uses: DeterminateSystems/nix-installer-action@v20
      - uses: DeterminateSystems/magic-nix-cache-action@v13
      - name: Check flake metadata
        run: nix flake metadata --no-write-lock-file
      - name: Enumerate checks
        id: matrix
        run: echo "value=$(nix eval --json .#ciMatrix.x86_64-linux)" >> "$GITHUB_OUTPUT"
      - name: Check generated documentation
        run: |
          nix run .#generate-docs
          git diff --exit-code

  tests:
    name: ${{ matrix.backend }} / ${{ matrix.check }}
    needs: evaluate
    runs-on: ubuntu-latest
    timeout-minutes: ${{ matrix.timeout }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.evaluate.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v5
      - uses: DeterminateSystems/nix-installer-action@v20
      - uses: DeterminateSystems/magic-nix-cache-action@v13
      - name: Enable VM acceleration
        if: matrix.backend == 'machine'
        run: sudo chmod 666 /dev/kvm
      - name: Build check
        run: nix build ".#checks.x86_64-linux.\"${{ matrix.check }}\"" --no-link -L
