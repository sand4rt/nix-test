[book]
title = "Nix Test"
description = "A declarative testing framework for testing user-facing behavior in Nix"
authors = ["Nix Test contributors"]
language = "en"
src = "docs/src"

[build]
build-dir = "book"

[output.html]
default-theme = "navy"
preferred-dark-theme = "navy"
additional-css = ["docs/theme/api-tabs.css"]
additional-js = ["docs/theme/api-tabs.js"]

[output.html.search]
enable = true
limit-results = 20
use-boolean-and = true
